name: Validate

on:
  push:
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Every cross-reference in the model resolves, and docs/ matches data/
        run: python scripts/validate_model.py
      - name: The committed demo portfolio is what the seeder produces
        run: python scripts/seed_portfolio.py --check
      - name: Browser scripts parse
        run: |
          for f in engine.js views.js report.js app.js; do
            node -e "new Function(require('fs').readFileSync('docs/$f','utf8'))" || exit 1
          done

  browser:
    runs-on: ubuntu-latest
    needs: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install puppeteer@25
      - name: Serve the site
        run: |
          python3 -m http.server 8813 --directory docs &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8813/ >/dev/null && break; sleep 0.5; done
      - name: Headless assertions, including an independent recomputation of the maths
        run: node tests/assert.mjs http://127.0.0.1:8813/
