<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Governance Control Room</title>
  <desc id="desc">A dark cyan product banner for an AI governance operator console.</desc>
