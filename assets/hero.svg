  <rect width="1400" height="360" rx="28" fill="url(#bg)"/><circle cx="1160" cy="86" r="180" fill="#22d3ee" opacity=".08"/><circle cx="1260" cy="280" r="130" fill="#60a5fa" opacity=".08"/>
