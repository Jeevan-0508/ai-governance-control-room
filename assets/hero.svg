  <rect x="76" y="276" width="410" height="3" fill="url(#glow)"/><text x="76" y="316" fill="#a7c3d5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19">See coverage, evidence, gaps, and exposure in one view.</text>
